<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MecaGest: Formulario de Registro de Nuevos Usuarios - 25XXXX </title>
</head>
<body>
  <header>
    <h1>MecaGest</h1>
    <h2>Registro de Nuevos Usuarios</h2>
    <p>Complete los campos para solicitar una cuenta en el sistema.</p>
  </header>

  <main>
     <form action="" method="">
        <fieldset>
          <legend>Datos Personales</legend>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" placeholder="Marco Antonio" required>
          <br>
          <label for="apPaterno">Apellido Paterno:</label>
          <input type="text" id="apPaterno" placeholder="Ramírez" required>
          <br>
        <label for="apMaterno">Apellido Materno:</label>
        <input type="text" id="apMaterno" placeholder="Hernández">
        <br>
        <label for="genero">Género:</label>
        <select id="genero">
            <option value="F">Femenino</option>
            <option value="M">Masculino</option>
            <option value="X">Prefiero no decirlo</option>          
        </select>
        <br>
        <label for="fechaNacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="fechaNacimiento">
            
        </fieldset>

        <fieldset>
            <legend>Datos de Contacto</legend>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" placeholder="marco@ejemplo.com">
            <br>
            <label for="numTelefonico">Número Telefónico:</label>
            <input type="tel" id="numTelefonico" placeholder="(55) 1234-5678">
            <br>
            <label for="horarioContacto">Favor de contactar en el horario:</label>
            <input type="time" id="horarioContactoInicio" placeholder="09:00"> a
            <input type="time" id="horarioContactoFin" placeholder="18:00">
        </fieldset>

        <fieldset>
            <legend>Datos de Acceso</legend>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" placeholder="marcoramirez" required>
            <br>
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" placeholder="********" required>
            <br>
            <label for="confirmarContrasena">Confirmar Contraseña:</label>
            <input type="password" id="confirmarContrasena" placeholder="********" required>
        </fieldset>

        <fieldset>
            <legend>Datos de Ubicación</legend>
            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" placeholder="Calle, Número, Colonia">
            <br>
            <label for="pais">País:</label>
            <input type="text" id="pais" placeholder="México">  
            <br>
            <label for="estado">Estado:</label>
            <input type="text" id="estado" placeholder="Ciudad de México">  
            <br>
            <label for="ciudad">Ciudad:</label>
            <input type="text" id="ciudad" placeholder="Ciudad de México">  
            <br>
            <label for="codigoPostal">Código Postal:</label>
            <input type="text" id="codigoPostal" placeholder="01234">   
        </fieldset>
        <input type="submit" value="Enviar Solicitud">        
      </form>
  </main>
    
</body>
</html>
